<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>手机号登录 - CargoMove</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#398e3d",
                        "background-light": "#f6f8f6",
                        "background-dark": "#151d15",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e261e",
                        "border-light": "#d5e1d6",
                        "border-dark": "#2a362a",
                    },
                    fontFamily: {
                        "display": ["Inter", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom tweaks for cleaner inputs */
        .form-input:focus {
            box-shadow: none !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-gray-900 dark:text-white h-screen flex flex-col overflow-hidden">
<!-- Status Bar Spacer (Simulated) -->
<div class="h-12 w-full bg-transparent"></div>
<!-- Navigation/Header -->
<header class="flex items-center justify-between px-6 py-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-gray-900 dark:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<button class="text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-primary transition-colors">
            帮助
        </button>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-6 pt-6 pb-8 overflow-y-auto">
<!-- Logo & Headline Section -->
<div class="mb-10 mt-4 animate-fade-in-up">
<div class="w-14 h-14 bg-primary rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-white text-3xl">local_shipping</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white mb-2">
                欢迎回来
            </h1>
<p class="text-gray-500 dark:text-gray-400 text-base">
                CargoMove 司机端，轻松接单管理
            </p>
</div>
<!-- Login Form -->
<div class="space-y-6 w-full max-w-md mx-auto">
<!-- Phone Number Field -->
<div class="group">
<label class="block text-sm font-medium text-gray-900 dark:text-gray-200 mb-2">
                    手机号
                </label>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
<span class="text-gray-500 dark:text-gray-400 font-medium border-r border-gray-200 dark:border-gray-700 pr-3 mr-3 text-base">+86</span>
</div>
<input class="form-input block w-full pl-[4.5rem] pr-4 py-4 bg-surface-light dark:bg-surface-dark border-border-light dark:border-border-dark rounded-xl text-base text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" placeholder="请输入手机号" type="tel"/>
</div>
</div>
<!-- Verification Code Field -->
<div class="group">
<label class="block text-sm font-medium text-gray-900 dark:text-gray-200 mb-2">
                    验证码
                </label>
<div class="relative flex items-center">
<input class="form-input block w-full pl-4 pr-32 py-4 bg-surface-light dark:bg-surface-dark border-border-light dark:border-border-dark rounded-xl text-base text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" placeholder="请输入6位验证码" type="number"/>
<div class="absolute inset-y-0 right-2 flex items-center">
<button class="h-10 px-4 text-sm font-bold text-primary hover:text-green-700 dark:hover:text-green-400 bg-primary/10 hover:bg-primary/20 rounded-lg transition-colors flex items-center justify-center min-w-[6rem]">
                            获取验证码
                        </button>
</div>
</div>
</div>
<!-- Login Button -->
<div class="pt-4">
<button class="w-full flex items-center justify-center h-14 bg-primary hover:bg-green-700 text-white font-bold text-lg rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all duration-200">
                    登录
                </button>
</div>
</div>
<!-- Spacer to push footer down -->
<div class="flex-grow"></div>
<!-- Footer / Legal -->
<div class="mt-8 text-center px-4">
<p class="text-xs text-gray-400 dark:text-gray-500 leading-relaxed">
                登录即代表您同意 CargoMove 
                <a class="text-primary hover:underline font-medium" href="#">《用户协议》</a> 
                和 
                <a class="text-primary hover:underline font-medium" href="#">《隐私政策》</a>
</p>
</div>
</main>
<!-- Decorative Background Elements -->
<div class="fixed top-0 right-0 -z-10 w-64 h-64 bg-primary/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2" data-alt="Abstract soft green gradient circle at top right"></div>
<div class="fixed bottom-0 left-0 -z-10 w-48 h-48 bg-primary/5 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2" data-alt="Abstract soft green gradient circle at bottom left"></div>
</body></html>
