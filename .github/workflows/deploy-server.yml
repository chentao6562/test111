name: Deploy Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Compress server folder
        run: |
          tar -czf server.tar.gz -C server .

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "server.tar.gz"
          target: "${{ secrets.APP_DIR }}/"

      - name: Deploy and restart service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            mkdir -p "${{ secrets.APP_DIR }}/server"
            cd "${{ secrets.APP_DIR }}"
            tar -xzf server.tar.gz -C server
            cd server
            npm ci --omit=dev
            # 启动/重启服务（优先使用 pm2）
            if command -v pm2 >/dev/null 2>&1; then
              pm2 describe firework-api >/dev/null 2>&1 && pm2 reload firework-api || pm2 start dist/app.js --name firework-api
              pm2 save
            else
              # 回退：使用 nohup
              pkill -f "dist/app.js" || true
              nohup node dist/app.js > ../app.out 2>&1 &
            fi
            echo "Deploy done at $(date '+%F %T')"
