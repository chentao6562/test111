<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>代理申请页</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e53734", // Chinese Red
                        "primary-dark": "#b91c1c",
                        "accent": "#FDB933", // Gold
                        "background-light": "#F8F5F5", // Warm light gray
                        "background-dark": "#211111",
                        "card-light": "#ffffff",
                        "text-main": "#1b0e0e",
                        "text-secondary": "#96504f",
                        "border-color": "#f0e0e0"
                    },
                    fontFamily: {
                        "display": ["Inter", "Noto Sans SC", "sans-serif"],
                        "body": ["Inter", "Noto Sans SC", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                    backgroundImage: {
                        'header-gradient': 'linear-gradient(135deg, #e53734 0%, #c62828 100%)',
                        'gold-gradient': 'linear-gradient(135deg, #FFD700 0%, #FDB933 100%)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Noto Sans SC', 'Inter', sans-serif;
        }
        /* Hide scrollbar for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .chip-radio:checked + div {
            background-color: #FFF5F5;
            border-color: #e53734;
            color: #e53734;
        }
        
        .chip-radio:checked + div .check-icon {
            opacity: 1;
            transform: scale(1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-text-main antialiased min-h-screen flex flex-col font-display selection:bg-primary/20">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-50 w-full bg-header-gradient shadow-md">
<!-- Festive Pattern Overlay (Abstract) -->
<div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/chinese-new-year.png')] pointer-events-none mix-blend-overlay" data-alt="Subtle Chinese traditional pattern overlay"></div>
<div class="relative flex items-center justify-between px-4 h-14 pt-2 pb-2 text-white">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/10 active:bg-white/20 transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold tracking-wide">申请成为代理</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto no-scrollbar pb-32">
<!-- Progress Stepper -->
<div class="bg-header-gradient pb-8 pt-4 px-6 rounded-b-[2rem] shadow-sm relative overflow-hidden">
<div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/chinese-new-year.png')] pointer-events-none mix-blend-overlay" data-alt="Subtle Chinese traditional pattern overlay"></div>
<div class="relative flex items-center justify-between text-white/80 text-xs font-medium z-10">
<!-- Step 1 -->
<div class="flex flex-col items-center gap-2 w-1/3">
<div class="w-8 h-8 rounded-full bg-white text-primary flex items-center justify-center font-bold shadow-lg ring-4 ring-white/20">1</div>
<span class="text-white font-bold">填写资料</span>
</div>
<!-- Connector 1-2 -->
<div class="h-[2px] bg-white/30 flex-1 mb-6 relative">
<div class="absolute left-0 top-0 h-full bg-white/30 w-0"></div> <!-- Progress fill could go here -->
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-2 w-1/3 opacity-70">
<div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center border border-white/40">2</div>
<span>提交审核</span>
</div>
<!-- Connector 2-3 -->
<div class="h-[2px] bg-white/30 flex-1 mb-6"></div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-2 w-1/3 opacity-70">
<div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center border border-white/40">3</div>
<span>审核通过</span>
</div>
</div>
</div>
<!-- Form Cards Container -->
<div class="px-4 -mt-4 relative z-20 space-y-4">
<!-- Card 1: Basic Info -->
<section class="bg-card-light rounded-xl shadow-sm border border-border-color overflow-hidden">
<div class="px-5 py-3 border-b border-gray-100 flex items-center gap-2 bg-gray-50/50">
<span class="material-symbols-outlined text-primary text-[20px]">person</span>
<h3 class="font-bold text-text-main">基本信息</h3>
</div>
<div class="p-5 space-y-5">
<!-- Name -->
<label class="block group">
<span class="block text-sm font-medium text-text-secondary mb-1.5">姓名 <span class="text-primary">*</span></span>
<input class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-gray-400 text-text-main" placeholder="请输入真实姓名" type="text"/>
</label>
<!-- Phone (Read Only) -->
<label class="block opacity-80">
<span class="block text-sm font-medium text-text-secondary mb-1.5">手机号 <span class="text-xs text-primary/80 ml-1">(已绑定)</span></span>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg bg-gray-100 border-none text-gray-600 font-medium select-none cursor-not-allowed" readonly="" type="text" value="138 **** 8888"/>
<span class="material-symbols-outlined absolute right-3 top-3.5 text-green-600 text-[20px]">verified</span>
</div>
</label>
<!-- ID Card -->
<label class="block">
<span class="block text-sm font-medium text-text-secondary mb-1.5">身份证号 <span class="text-xs text-gray-400 font-normal">(选填)</span></span>
<input class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-gray-400 text-text-main" placeholder="请输入身份证号码" type="text"/>
</label>
</div>
</section>
<!-- Card 2: Business Info -->
<section class="bg-card-light rounded-xl shadow-sm border border-border-color overflow-hidden">
<div class="px-5 py-3 border-b border-gray-100 flex items-center gap-2 bg-gray-50/50">
<span class="material-symbols-outlined text-primary text-[20px]">storefront</span>
<h3 class="font-bold text-text-main">经营信息</h3>
</div>
<div class="p-5 space-y-5">
<!-- Region Selector -->
<div class="block">
<span class="block text-sm font-medium text-text-secondary mb-1.5">所在地区 <span class="text-primary">*</span></span>
<button class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 hover:border-primary/50 text-left flex items-center justify-between group transition-colors">
<span class="text-gray-400 group-hover:text-gray-600">请选择省/市/区</span>
<span class="material-symbols-outlined text-gray-400 group-hover:text-primary">chevron_right</span>
</button>
</div>
<!-- Detailed Address -->
<label class="block">
<span class="block text-sm font-medium text-text-secondary mb-1.5">详细地址 <span class="text-primary">*</span></span>
<textarea class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-gray-400 text-text-main resize-none" placeholder="街道、楼牌号等" rows="3"></textarea>
</label>
<!-- Sales Channels (Multi-select) -->
<div class="block">
<span class="block text-sm font-medium text-text-secondary mb-2.5">主要销售渠道 <span class="text-xs text-gray-400">(多选)</span></span>
<div class="flex flex-wrap gap-2.5">
<!-- Option 1 -->
<label class="cursor-pointer">
<input checked="" class="chip-radio hidden" type="checkbox"/>
<div class="px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-medium transition-all flex items-center gap-1.5 hover:bg-gray-50">
<span class="material-symbols-outlined text-[18px] check-icon transition-transform duration-200 opacity-50">store</span>
                                    线下门店
                                </div>
</label>
<!-- Option 2 -->
<label class="cursor-pointer">
<input class="chip-radio hidden" type="checkbox"/>
<div class="px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-medium transition-all flex items-center gap-1.5 hover:bg-gray-50">
<span class="material-symbols-outlined text-[18px] check-icon transition-transform duration-200 opacity-50 scale-0">chat</span>
                                    微信社群
                                </div>
</label>
<!-- Option 3 -->
<label class="cursor-pointer">
<input class="chip-radio hidden" type="checkbox"/>
<div class="px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-medium transition-all flex items-center gap-1.5 hover:bg-gray-50">
<span class="material-symbols-outlined text-[18px] check-icon transition-transform duration-200 opacity-50 scale-0">groups</span>
                                    社区团购
                                </div>
</label>
<!-- Option 4 -->
<label class="cursor-pointer">
<input class="chip-radio hidden" type="checkbox"/>
<div class="px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-medium transition-all flex items-center gap-1.5 hover:bg-gray-50">
<span class="material-symbols-outlined text-[18px] check-icon transition-transform duration-200 opacity-50 scale-0">add</span>
                                    其他
                                </div>
</label>
</div>
</div>
</div>
</section>
<!-- Card 3: Referral Info -->
<section class="bg-card-light rounded-xl shadow-sm border border-border-color overflow-hidden">
<div class="px-5 py-3 border-b border-gray-100 flex items-center gap-2 bg-gray-50/50">
<span class="material-symbols-outlined text-primary text-[20px]">badge</span>
<h3 class="font-bold text-text-main">邀请人信息</h3>
</div>
<div class="p-5 space-y-5">
<label class="block">
<span class="block text-sm font-medium text-text-secondary mb-1.5">邀请码 <span class="text-xs text-gray-400 font-normal">(选填)</span></span>
<div class="flex gap-2">
<input class="flex-1 px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-gray-400 text-text-main" placeholder="输入邀请码" type="text"/>
<button class="px-4 py-2 bg-accent/10 text-orange-600 text-sm font-bold rounded-lg hover:bg-accent/20 transition-colors whitespace-nowrap border border-accent/20">
                                 验证
                             </button>
</div>
</label>
<!-- Dynamic Referrer Display (Hidden by default or shown if verified) -->
<div class="hidden flex items-center gap-3 p-3 bg-green-50 rounded-lg border border-green-100">
<div class="w-8 h-8 rounded-full bg-green-200 flex items-center justify-center text-green-700 font-bold text-xs">李</div>
<div class="flex flex-col">
<span class="text-xs text-gray-500">邀请人</span>
<span class="text-sm font-bold text-gray-800">李大发 (区域经理)</span>
</div>
</div>
</div>
</section>
<div class="h-6"></div> <!-- Spacer -->
</div>
</main>
<!-- Footer Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-100 p-4 pb-8 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<!-- Agreement Checkbox -->
<div class="flex items-start gap-2 mb-4 px-1">
<div class="relative flex items-center pt-0.5">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-gray-300 transition-all checked:border-primary checked:bg-primary" id="agreement" type="checkbox"/>
<span class="material-symbols-outlined absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-[16px] text-white opacity-0 peer-checked:opacity-100 pointer-events-none pt-0.5">check</span>
</div>
<label class="text-sm text-gray-500 cursor-pointer select-none leading-tight" for="agreement">
                我已阅读并同意 <a class="text-primary font-medium hover:underline decoration-primary/50" href="#">《代理商入驻协议》</a> 及 <a class="text-primary font-medium hover:underline decoration-primary/50" href="#">《隐私政策》</a>
</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-dark active:scale-[0.99] text-white font-bold text-lg py-3.5 rounded-xl shadow-lg shadow-primary/30 transition-all flex items-center justify-center gap-2">
            提交申请
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</body></html>
