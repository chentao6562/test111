<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Agent Promotion Center</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">

            colors: {
              "primary": "#e53734",
              "background-light": "#f8f6f6",
              "background-dark": "#211111",

              "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]

<style>

            background: linear-gradient(180deg, #FFD700 0%, #FDB931 100%);

            background-clip: text;
        }
        .bg-gold-gradient {
            background: linear-gradient(135deg, #FDB931 0%, #f59e0b 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white pb-24 overflow-x-hidden selection:bg-primary/20">

<div class="sticky top-0 z-50 flex w-full flex-col bg-primary shadow-md">

</button>

</div>

<div class="flex items-center gap-2 text-white/90">

</div>

</div>
</div>

<div class="mt-1 flex items-center gap-0.5 rounded-full bg-red-50 dark:bg-red-900/20 px-1.5 py-0.5 text-[10px] font-bold text-primary">

</div>
</div>

</div>

<div class="bg-primary/5 px-2 py-1 rounded text-primary text-xs font-semibold">

</button>
<button class="flex flex-1 flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">grid_view</span>
<span class="text-[10px] font-medium">分类</span>
</button>
<!-- Active Center Tab -->
<div class="relative flex flex-1 flex-col items-center justify-end">
<button class="absolute -top-6 flex size-12 items-center justify-center rounded-full bg-primary shadow-lg shadow-red-500/40 ring-4 ring-white dark:ring-[#1e1e1e] transition-transform active:scale-95">
<span class="material-symbols-outlined text-white" style="font-size: 24px;">campaign</span>
</button>
